<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Partner Login - FoodFusion</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0d1117;
            --surface: #161b22;
            --surface-2: #21262d;
            --primary: #f97316;
            --primary-gradient: linear-gradient(135deg, #f97316, #eab308);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: rgba(255, 255, 255, 0.1);
            --destructive: #ef4444;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(249, 115, 22, 0.15), transparent 50%),
                radial-gradient(circle at 85% 90%, rgba(16, 185, 129, 0.1), transparent 50%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(12px);
            padding: 1rem 1.5rem;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.25rem;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: var(--primary-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .gradient-text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        main.container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hotel-icon {
            width: 56px;
            height: 56px;
            background: var(--primary-gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.3);
        }

        .card-header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot-link {
            color: var(--primary);
            font-size: 0.75rem;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            height: 44px;
            padding: 0 1rem 0 2.6rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25);
        }

        .form-control.error {
            border-color: var(--destructive);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-btn:hover {
            color: var(--text-main);
        }

        .error-message {
            color: var(--destructive);
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.25rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group label {
            color: var(--text-muted);
            font-size: 0.875rem;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: var(--primary-gradient);
            color: #0d1117;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-submit:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(13, 17, 23, 0.3);
            border-top-color: #0d1117;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast-notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            gap: 0.75rem;
            z-index: 100;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">
                <div class="logo-icon">🔥</div>
                <span>Food<span class="gradient-text">Fusion</span></span>
            </a>
            <a href="/" class="back-link">
                ← Back to Home
            </a>
        </nav>
    </header>

    <main class="container">
        <div class="auth-card">
            <div class="card-header">
                <div class="hotel-icon">🏨</div>
                <h1>Hotel Partner <span class="gradient-text">Login</span></h1>
                <p>Manage your restaurant orders & menu in live partner portal.</p>
            </div>

            <form id="hotel-login-form" novalidate>
                <div class="form-group">
                    <label for="hotel-email">Hotel Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="hotel-email" class="form-control" placeholder="hotel@restaurant.com">
                    </div>
                    <div id="email-error" class="error-message" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="hotel-password">Password</label>
                        <a href="#" id="forgot-password-link" class="forgot-link">Forgot Password?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="hotel-password" class="form-control" placeholder="••••••••••••">
                        <button type="button" id="toggle-password" class="toggle-btn" title="Show/Hide password">👁️</button>
                    </div>
                    <div id="password-error" class="error-message" style="display: none;"></div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Remember Me</label>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    <span>Login to Partner Hub</span>
                </button>
            </form>
        </div>
    </main>

    <div id="toast" class="toast-notification">
        <span id="toast-icon">ℹ️</span>
        <span id="toast-message">Notification message</span>
    </div>

    <script>
        const form = document.getElementById('hotel-login-form');
        const emailInput = document.getElementById('hotel-email');
        const passwordInput = document.getElementById('hotel-password');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');
        const submitBtn = document.getElementById('submit-btn');
        const forgotLink = document.getElementById('forgot-password-link');
        const toast = document.getElementById('toast');

        // Toggle Show/Hide Password
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
        });

        // Validation helpers
        function validateEmail(email) {
            if (!email.trim()) return "Hotel Email is required";
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.trim())) return "Please enter a valid email address";
            return "";
        }

        function validatePassword(password) {
            if (!password) return "Password is required";
            if (password.length < 6) return "Password must be at least 6 characters";
            return "";
        }

        function showInputError(input, errorEl, message) {
            if (message) {
                input.classList.add('error');
                errorEl.textContent = '⚠️ ' + message;
                errorEl.style.display = 'flex';
            } else {
                input.classList.remove('error');
                errorEl.style.display = 'none';
            }
        }

        emailInput.addEventListener('blur', () => {
            showInputError(emailInput, emailError, validateEmail(emailInput.value));
        });

        passwordInput.addEventListener('blur', () => {
            showInputError(passwordInput, passwordError, validatePassword(passwordInput.value));
        });

        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (validateEmail(email)) {
                showToast('Please enter your hotel email above first', '⚠️');
            } else {
                showToast(`Password reset link sent to ${email}`, '✅');
            }
        });

        function showToast(message, icon = 'ℹ️') {
            document.getElementById('toast-icon').textContent = icon;
            document.getElementById('toast-message').textContent = message;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailErr = validateEmail(emailInput.value);
            const passErr = validatePassword(passwordInput.value);

            showInputError(emailInput, emailError, emailErr);
            showInputError(passwordInput, passwordError, passErr);

            if (emailErr || passErr) {
                showToast('Please fix validation errors', '❌');
                return;
            }

            // Disable button & show spinner
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<div class="spinner"></div><span>Logging in...</span>`;

            setTimeout(() => {
                showToast('Hotel Login Successful! Redirecting...', '🎉');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1200);
            }, 1500);
        });
    </script>
</body>
</html>
