<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - FoodHub</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="/index.html" class="logo">🍔 FoodHub</a>
            <ul class="nav-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/restaurants.html">Restaurants</a></li>
                <li>
                    <a href="/cart.html" class="cart-icon">
                        🛒 Cart
                        <span class="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="order-container">
            <h2 style="margin-bottom: 2rem;">My Orders</h2>
            <div id="orders-list">
                <div class="spinner"></div>
            </div>
            <div id="no-orders" style="text-align: center; padding: 3rem; display: none;">
                <h3>No orders yet</h3>
                <p>Start ordering delicious food from our restaurants!</p>
                <a href="/restaurants.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Restaurants</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 FoodHub. All rights reserved.</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function loadOrders() {
            if (!requireAuth()) return;

            try {
                const orders = await API.Order.getOrders();
                
                if (orders && orders.length > 0) {
                    const ordersList = document.getElementById('orders-list');
                    ordersList.innerHTML = orders.map(order => `
                        <div class="order-card">
                            <div class="order-header">
                                <div>
                                    <h3>Order #${order.id.slice(0, 8)}</h3>
                                    <p>${formatDate(order.created_at)}</p>
                                </div>
                                <span class="order-status status-${order.status.toLowerCase().replace(' ', '-')}">${order.status}</span>
                            </div>
                            <div class="order-details">
                                <p><strong>Total Amount:</strong> ${formatCurrency(order.total_amount)}</p>
                                <p><strong>Payment Method:</strong> ${order.payment_method || 'Cash on Delivery'}</p>
                                ${order.notes ? `<p><strong>Notes:</strong> ${order.notes}</p>` : ''}
                            </div>
                            ${order.status === 'PENDING' || order.status === 'ACCEPTED' ? `
                                <button onclick="cancelOrder('${order.id}')" class="btn btn-sm" style="background-color: var(--danger-color); color: white; margin-top: 1rem;">Cancel Order</button>
                            ` : ''}
                        </div>
                    `).join('');
                    document.getElementById('no-orders').style.display = 'none';
                } else {
                    document.getElementById('orders-list').innerHTML = '';
                    document.getElementById('no-orders').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('orders-list').innerHTML = '<p>Failed to load orders. Please try again.</p>';
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm('Are you sure you want to cancel this order?')) return;

            try {
                await API.Order.cancelOrder(orderId);
                showAlert('Order cancelled successfully!', 'success');
                loadOrders();
            } catch (error) {
                showAlert('Failed to cancel order: ' + error.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
