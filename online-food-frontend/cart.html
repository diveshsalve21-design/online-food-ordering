<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - FoodHub</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="/index.html" class="logo">🍔 FoodHub</a>
            <ul class="nav-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/restaurants.html">Restaurants</a></li>
                <li>
                    <a href="/cart.html" class="cart-icon">
                        🛒 Cart
                        <span class="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="cart-container">
            <h2 style="margin-bottom: 2rem;">Your Shopping Cart</h2>
            <div id="cart-items">
                <div class="spinner"></div>
            </div>
            <div class="cart-summary" id="cart-summary" style="display: none;">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-amount">$0.00</span>
                </div>
                <button id="checkout-btn" class="btn btn-primary" style="width: 100%;">Proceed to Checkout</button>
            </div>
            <div id="empty-cart" style="text-align: center; padding: 3rem; display: none;">
                <h3>Your cart is empty</h3>
                <p>Add some delicious items from our restaurants!</p>
                <a href="/restaurants.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Restaurants</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 FoodHub. All rights reserved.</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let currentCart = null;
        let cartItemsList = [];

        async function loadCart() {
            if (!requireAuth()) return;

            try {
                const carts = await API.Cart.getCarts();
                
                if (carts && carts.length > 0) {
                    currentCart = carts[0]; // Get first cart
                    await loadCartItems();
                } else {
                    showEmptyCart();
                }
            } catch (error) {
                console.error('Error loading cart:', error);
                showEmptyCart();
            }
        }

        async function loadCartItems() {
            try {
                cartItemsList = await API.CartItem.getCartItems();
                
                if (cartItemsList.length === 0) {
                    showEmptyCart();
                    return;
                }

                const cartItemsContainer = document.getElementById('cart-items');
                cartItemsContainer.innerHTML = cartItemsList.map(item => `
                    <div class="cart-item">
                        <img src="${item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100'}" 
                             alt="${item.name}" class="cart-item-image"
                             onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100'">
                        <div class="cart-item-details">
                            <h4>${item.menu_item_name || item.name || 'Menu Item'}</h4>
                            <p>${formatCurrency(item.unit_price)}</p>
                        </div>
                        <div class="cart-item-quantity">
                            <button class="quantity-btn" onclick="updateQuantity('${item.id}', ${item.quantity - 1})">-</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity('${item.id}', ${item.quantity + 1})">+</button>
                        </div>
                        <div style="margin-left: 1rem;">
                            ${formatCurrency(item.unit_price * item.quantity)}
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="removeItem('${item.id}')" style="margin-left: 1rem; background-color: var(--danger-color); color: white;">✕</button>
                    </div>
                `).join('');

                // Calculate and display total
                const total = cartItemsList.reduce((sum, item) => sum + (item.unit_price * item.quantity), 0);
                document.getElementById('cart-total-amount').textContent = formatCurrency(total);
                document.getElementById('cart-summary').style.display = 'block';
                document.getElementById('empty-cart').style.display = 'none';
            } catch (error) {
                console.error('Error loading cart items:', error);
                showEmptyCart();
            }
        }

        function showEmptyCart() {
            document.getElementById('cart-items').innerHTML = '';
            document.getElementById('cart-summary').style.display = 'none';
            document.getElementById('empty-cart').style.display = 'block';
        }

        async function updateQuantity(itemId, newQuantity) {
            if (newQuantity <= 0) {
                removeItem(itemId);
                return;
            }

            try {
                await API.CartItem.updateCartItem(itemId, { quantity: newQuantity });
                loadCartItems();
                updateCartCount();
            } catch (error) {
                showAlert('Failed to update quantity', 'error');
            }
        }

        async function removeItem(itemId) {
            try {
                await API.CartItem.removeCartItem(itemId);
                loadCartItems();
                updateCartCount();
            } catch (error) {
                showAlert('Failed to remove item', 'error');
            }
        }

        document.getElementById('checkout-btn').addEventListener('click', async () => {
            if (!requireAuth()) return;

            try {
                const orderData = {
                    user_id: getCurrentUser().id,
                    total_amount: cartItemsList.reduce((sum, item) => sum + (item.unit_price * item.quantity), 0),
                    status: 'PENDING',
                    payment_method: 'CASH_ON_DELIVERY'
                };

                const order = await API.Order.createOrder(orderData);
                showAlert('Order placed successfully!', 'success');
                setTimeout(() => {
                    window.location.href = '/orders.html';
                }, 1000);
            } catch (error) {
                showAlert('Failed to place order: ' + error.message, 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
